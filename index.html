<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devotion Donation - Sri Ankalama Devasthanam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            templeGold: '#D4AF37',
            templeSaffron: '#C0392B',
            templeCream: '#FAFAFA',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-templeCream text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-templeSaffron text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🛕</span>
        <h1 class="text-xl font-bold">Sri Ankalama Devasthanam</h1>
      </div>
    </div>
  </header>

  <!-- Main Interface -->
  <main class="max-w-3xl mx-auto my-8 px-4 w-full">
    <div class="bg-white p-6 md:p-10 rounded-2xl shadow-xl border-t-4 border-templeGold">
      
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-templeSaffron">Devotee Seva & Donation</h2>
        <p class="text-sm text-gray-500 mt-1">Select or enter your offering amount</p>
      </div>

      <form id="bookingForm" onsubmit="processBooking(event)" class="space-y-6">
        
        <!-- Step 1: Donation Amount Buttons -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-4">
          <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
            <span class="bg-templeSaffron text-white text-xs w-6 h-6 rounded-full flex items-center justify-center">1</span> 
            Select Offering Amount
          </h3>
          
          <!-- Preset Buttons -->
          <div class="grid grid-cols-3 gap-3">
            <button type="button" onclick="selectPreset(216)" id="btn-216" class="amount-btn border-2 border-gray-300 bg-white hover:border-templeSaffron font-bold py-3 rounded-xl transition">₹216</button>
            <button type="button" onclick="selectPreset(516)" id="btn-516" class="amount-btn border-2 border-gray-300 bg-white hover:border-templeSaffron font-bold py-3 rounded-xl transition">₹516</button>
            <button type="button" onclick="selectPreset(1116)" id="btn-1116" class="amount-btn border-2 border-gray-300 bg-white hover:border-templeSaffron font-bold py-3 rounded-xl transition">₹1116</button>
          </div>

          <!-- Custom Amount Input -->
          <div>
            <label class="block text-sm font-semibold mb-1">Or Enter Custom Amount (₹)</label>
            <input type="number" id="customAmount" min="100" placeholder="Minimum amount ₹100" oninput="handleCustomInput()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            <p id="amountError" class="hidden text-xs text-red-600 font-semibold mt-1">⚠️ Minimum donation amount is ₹100</p>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Seva Date</label>
            <input type="date" id="sevaDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
          </div>
        </div>

        <!-- Step 2: Devotee Particulars (Optional) -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-4">
          <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
            <span class="bg-templeSaffron text-white text-xs w-6 h-6 rounded-full flex items-center justify-center">2</span> 
            Devotee Particulars <span class="text-xs font-normal text-gray-500">(Optional)</span>
          </h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Primary Devotee Name (Optional)</label>
              <input type="text" id="devoteeName" placeholder="Full Name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Gothram (Optional)</label>
              <input type="text" id="gothram" placeholder="Enter Gothram" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Phone Number (Optional)</label>
              <input type="tel" id="phone" placeholder="10-digit Mobile Number" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Nakshatram (Optional)</label>
              <input type="text" id="nakshatram" placeholder="e.g. Rohini, Uttara" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>
          </div>
        </div>

        <!-- Step 3: Payment Method -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-4">
          <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
            <span class="bg-templeSaffron text-white text-xs w-6 h-6 rounded-full flex items-center justify-center">3</span> 
            Payment Mode
          </h3>

          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <label class="flex items-center p-3 bg-white border rounded-lg cursor-pointer hover:border-templeSaffron">
              <input type="radio" name="payment" value="UPI" checked class="text-templeSaffron focus:ring-templeSaffron" />
              <span class="ml-2 font-medium text-sm">UPI / QR Code</span>
            </label>
            <label class="flex items-center p-3 bg-white border rounded-lg cursor-pointer hover:border-templeSaffron">
              <input type="radio" name="payment" value="Card" class="text-templeSaffron focus:ring-templeSaffron" />
              <span class="ml-2 font-medium text-sm">Credit / Debit Card</span>
            </label>
            <label class="flex items-center p-3 bg-white border rounded-lg cursor-pointer hover:border-templeSaffron">
              <input type="radio" name="payment" value="NetBanking" class="text-templeSaffron focus:ring-templeSaffron" />
              <span class="ml-2 font-medium text-sm">Net Banking</span>
            </label>
          </div>
        </div>

        <!-- Price Summary & Submit -->
        <div class="border-t pt-4 flex flex-col md:flex-row justify-between items-center gap-4">
          <div>
            <span class="text-sm text-gray-500">Total Payable Amount:</span>
            <div id="displayTotal" class="text-3xl font-extrabold text-templeSaffron">₹0</div>
          </div>
          <button type="submit" class="w-full md:w-auto bg-templeGold hover:bg-yellow-600 text-gray-900 font-extrabold px-8 py-4 rounded-xl shadow-lg transition transform hover:-translate-y-0.5">
            Confirm & Pay Now
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-templeSaffron text-white py-4 text-center text-xs">
    &copy; 2026 Sri Ankalama Devasthanam. All rights reserved.
  </footer>

  <!-- Dynamic Scripts -->
  <script>
    let currentAmount = 0;

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('sevaDate').setAttribute('min', today);
      document.getElementById('sevaDate').value = today;
    });

    function selectPreset(amount) {
      currentAmount = amount;
      document.getElementById('customAmount').value = '';
      hideAmountError();
      updateButtonStyles(amount);
      updateTotal();
    }

    function handleCustomInput() {
      const inputEl = document.getElementById('customAmount');
      const val = parseInt(inputEl.value, 10);

      updateButtonStyles(null);

      if (inputEl.value && val < 100) {
        showAmountError();
        currentAmount = val || 0;
      } else if (val >= 100) {
        hideAmountError();
        currentAmount = val;
      } else {
        hideAmountError();
        currentAmount = 0;
      }
      updateTotal();
    }

    function showAmountError() {
      document.getElementById('amountError').classList.remove('hidden');
      document.getElementById('customAmount').classList.add('border-red-500', 'focus:ring-red-500');
    }

    function hideAmountError() {
      document.getElementById('amountError').classList.add('hidden');
      document.getElementById('customAmount').classList.remove('border-red-500', 'focus:ring-red-500');
    }

    function updateButtonStyles(activeAmount) {
      const presets = [216, 516, 1116];
      presets.forEach(amt => {
        const btn = document.getElementById(`btn-${amt}`);
        if (amt === activeAmount) {
          btn.className = "amount-btn border-2 border-templeSaffron bg-templeSaffron text-white font-bold py-3 rounded-xl transition";
        } else {
          btn.className = "amount-btn border-2 border-gray-300 bg-white hover:border-templeSaffron font-bold py-3 rounded-xl transition";
        }
      });
    }

    function updateTotal() {
      document.getElementById('displayTotal').innerText = `₹${currentAmount.toLocaleString('en-IN')}`;
    }

    function processBooking(e) {
      e.preventDefault();
      
      if (currentAmount < 100) {
        alert("The minimum donation amount is ₹100. Please enter or select ₹100 or higher.");
        showAmountError();
        return;
      }

      const devotee = document.getElementById('devoteeName').value || 'Anonymous Devotee';
      alert(`Offering Received!\n\nDevotee: ${devotee}\nAmount: ₹${currentAmount}\n\nThank you for your generous contribution.`);
      window.location.reload();
    }
  </script>
</body>
</html>
