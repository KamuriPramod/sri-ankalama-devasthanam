<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Seva Booking - Sri Ankalama Devasthanam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            templeGold: '#D4AF37',
            templeSaffron: '#C0392B',
            templeCream: '#FAFAFA',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-templeCream text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-templeSaffron text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🛕</span>
        <h1 class="text-xl font-bold">Sri Ankalama Devasthanam</h1>
      </div>
      <a href="index.html" class="text-white hover:text-templeGold font-semibold text-sm transition flex items-center gap-1">
        &larr; Back to Home
      </a>
    </div>
  </header>

  <!-- Main Booking Interface -->
  <main class="max-w-3xl mx-auto my-8 px-4 w-full">
    <div class="bg-white p-6 md:p-10 rounded-2xl shadow-xl border-t-4 border-templeGold">
      
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-templeSaffron">Devotee Seva Booking</h2>
        <p class="text-sm text-gray-500 mt-1">Fill in your details to reserve your divine blessings</p>
      </div>

      <form id="bookingForm" onsubmit="processBooking(event)" class="space-y-6">
        
        <!-- Step 1: Seva Selection & Price -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-4">
          <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
            <span class="bg-templeSaffron text-white text-xs w-6 h-6 rounded-full flex items-center justify-center">1</span> 
            Seva & Date Details
          </h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Select Seva</label>
              <select id="sevaSelect" onchange="updatePrice()" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron">
                <option value="251">Special Sahasranama Archana - ₹251</option>
                <option value="501">Abhishekam Seva - ₹501</option>
                <option value="2500">Shaswat Pooja Endowment - ₹2,500</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Seva Date</label>
              <input type="date" id="sevaDate" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>
          </div>
        </div>

        <!-- Step 2: Devotee Information -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-4">
          <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
            <span class="bg-templeSaffron text-white text-xs w-6 h-6 rounded-full flex items-center justify-center">2</span> 
            Devotee Particulars
          </h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Primary Devotee Name</label>
              <input type="text" id="devoteeName" required placeholder="Full Name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Gothram</label>
              <input type="text" id="gothram" required placeholder="Enter Gothram" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Phone Number</label>
              <input type="tel" id="phone" required pattern="[0-9]{10}" placeholder="10-digit Mobile Number" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Nakshatram (Optional)</label>
              <input type="text" id="nakshatram" placeholder="e.g. Rohini, Uttara" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-templeSaffron" />
            </div>
          </div>
        </div>

        <!-- Step 3: Payment Method -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-4">
          <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">
            <span class="bg-templeSaffron text-white text-xs w-6 h-6 rounded-full flex items-center justify-center">3</span> 
            Payment Mode
          </h3>

          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <label class="flex items-center p-3 bg-white border rounded-lg cursor-pointer hover:border-templeSaffron">
              <input type="radio" name="payment" value="UPI" checked class="text-templeSaffron focus:ring-templeSaffron" />
              <span class="ml-2 font-medium text-sm">UPI / QR Code</span>
            </label>
            <label class="flex items-center p-3 bg-white border rounded-lg cursor-pointer hover:border-templeSaffron">
              <input type="radio" name="payment" value="Card" class="text-templeSaffron focus:ring-templeSaffron" />
              <span class="ml-2 font-medium text-sm">Credit / Debit Card</span>
            </label>
            <label class="flex items-center p-3 bg-white border rounded-lg cursor-pointer hover:border-templeSaffron">
              <input type="radio" name="payment" value="NetBanking" class="text-templeSaffron focus:ring-templeSaffron" />
              <span class="ml-2 font-medium text-sm">Net Banking</span>
            </label>
          </div>
        </div>

        <!-- Price Summary & Submit Button -->
        <div class="border-t pt-4 flex flex-col md:flex-row justify-between items-center gap-4">
          <div>
            <span class="text-sm text-gray-500">Total Payable Amount:</span>
            <div id="displayTotal" class="text-3xl font-extrabold text-templeSaffron">₹251</div>
          </div>
          <button type="submit" class="w-full md:w-auto bg-templeGold hover:bg-yellow-600 text-gray-900 font-extrabold px-8 py-4 rounded-xl shadow-lg transition transform hover:-translate-y-0.5">
            Confirm & Pay Now
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-templeSaffron text-white py-4 text-center text-xs">
    &copy; 2026 Sri Ankalama Devasthanam. All rights reserved.
  </footer>

  <!-- Automation Logic -->
  <script>
    // Autofill values from URL query parameters
    window.addEventListener('DOMContentLoaded', () => {
      // Set minimum date to today
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('sevaDate').setAttribute('min', today);
      document.getElementById('sevaDate').value = today;

      // Extract seva parameter from URL
      const urlParams = new URLSearchParams(window.location.search);
      const passedSeva = urlParams.get('seva');

      const sevaSelect = document.getElementById('sevaSelect');
      if (passedSeva) {
        for (let option of sevaSelect.options) {
          if (option.text.toLowerCase().includes(passedSeva.toLowerCase())) {
            option.selected = true;
            break;
          }
        }
      }
      updatePrice();
    });

    function updatePrice() {
      const sevaSelect = document.getElementById('sevaSelect');
      const price = sevaSelect.value;
      document.getElementById('displayTotal').innerText = `₹${parseInt(price).toLocaleString('en-IN')}`;
    }

    function processBooking(e) {
      e.preventDefault();
      const sevaName = document.getElementById('sevaSelect').options[document.getElementById('sevaSelect').selectedIndex].text;
      const devotee = document.getElementById('devoteeName').value;
      
      alert(`Booking Successful!\n\nDevotee: ${devotee}\nSeva: ${sevaName}\n\nA confirmation SMS has been sent to your mobile number.`);
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
