<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Seva - Sri Ankalama Devasthanam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            templeGold: '#D4AF37',
            templeSaffron: '#C0392B',
            templeCream: '#FAFAFA',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-templeCream text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-templeSaffron text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🛕</span>
        <h1 class="text-xl font-bold">Sri Ankalama Devasthanam</h1>
      </div>
      <a href="index.html" class="text-white hover:text-templeGold font-medium transition">&larr; Back to Home</a>
    </div>
  </header>

  <!-- Booking Form Container -->
  <main class="max-w-2xl mx-auto my-10 px-4 w-full">
    <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-templeGold">
      <h2 class="text-2xl font-bold text-templeSaffron mb-2 text-center">Seva Booking Form</h2>
      <p class="text-sm text-gray-500 text-center mb-6">Enter devotee details to confirm your slot</p>

      <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        
        <div>
          <label class="block text-sm font-semibold mb-1">Selected Seva</label>
          <input type="text" id="selectedSeva" class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg font-bold text-templeSaffron" readonly />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Devotee Full Name</label>
          <input type="text" required placeholder="Enter primary devotee name" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-templeSaffron" />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Gothram</label>
          <input type="text" required placeholder="Enter Gothram" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-templeSaffron" />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Seva Date</label>
          <input type="date" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-templeSaffron" />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Phone Number</label>
          <input type="tel" required placeholder="10-digit mobile number" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-templeSaffron" />
        </div>

        <button type="submit" class="w-full mt-4 bg-templeSaffron hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md transition">
          Proceed to Confirmation
        </button>

      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-templeSaffron text-white py-4 text-center text-xs">
    &copy; 2026 Sri Ankalama Devasthanam. All rights reserved.
  </footer>

  <script>
    // Autofill selected Seva from URL parameter
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const seva = urlParams.get('seva') || 'Special Sahasranama Archana';
      document.getElementById('selectedSeva').value = seva;
    };

    function handleFormSubmit(e) {
      e.preventDefault();
      alert("Booking request submitted successfully! Confirmation sent to your registered number.");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
